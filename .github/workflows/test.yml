name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          DB_PATH: ":memory:"
          FLASK_SECRET: "test-secret-key-32-chars-minimum!"
          ENV: "test"
          ETSY_API_KEY: "fake-etsy-key"
          STRIPE_SECRET_KEY: "sk_test_fake"
          STRIPE_WEBHOOK_SECRET: "whsec_test_fake"
          STRIPE_STARTER_PRICE_ID: "price_starter_fake"
          STRIPE_PRO_PRICE_ID: "price_pro_fake"
        run: python -m pytest web/tests -m "not integration" -v --tb=short
