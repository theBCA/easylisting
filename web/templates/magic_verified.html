<!DOCTYPE html>
<html lang="tr">
<head>
{% include '_gtag.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-posta Doğrulandı</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { color: #888; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #7c3aed;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
    }
    .hint { font-size: 13px; color: #555; margin-top: 16px; }
  </style>
{% include '_posthog.html' %}
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>E-posta doğrulandı!</h1>
    <p>Diğer sekmedeki işlem otomatik devam ediyor.<br>Bu sekmeyi kapatabilirsiniz.</p>
    <button class="btn" onclick="window.close()">Sekmeyi Kapat</button>
    <p class="hint" id="hint" style="display:none">Sekme kapatılamadı — <a href="/" style="color:#7c3aed">ana sayfaya dön</a></p>
  </div>
  <script>
    // Try to close; if browser blocks it, show fallback link
    window.close();
    setTimeout(() => {
      if (!window.closed) document.getElementById('hint').style.display = 'block';
    }, 300);
  </script>
</body>
</html>
