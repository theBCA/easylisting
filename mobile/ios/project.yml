name: EasyListing

options:
  bundleIdPrefix: com.easylisting
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"

targets:
  EasyListing:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EasyListing
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylisting
        INFOPLIST_FILE: EasyListing/Info.plist
        DEVELOPMENT_TEAM: C7387VC4FG  # BERK CEM ARSLAN (personal)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: com.easylisting AppStore
    info:
      path: EasyListing/Info.plist
      properties:
        CFBundleDisplayName: EasyListing
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - easylisting
            CFBundleURLName: com.easylisting
        NSCameraUsageDescription: "Camera access is needed to take product photos."
        NSPhotoLibraryUsageDescription: "Photo library access is needed to select product photos."
        NSPhotoLibraryAddUsageDescription: "Needed to save generated photos."
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  EasyListingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EasyListingTests
    dependencies:
      - target: EasyListing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylisting.tests
        GENERATE_INFOPLIST_FILE: YES

  EasyListingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EasyListingUITests
    dependencies:
      - target: EasyListing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylisting.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EasyListing
